name: CI/CD

on:
  pull_request:
    branches:
      - release/Smylio
  push:
    branches:
      - release/Smylio
      - 'feature/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tom_ci
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d tom_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify backend
        env:
          SUPABASE_JDBC_URL: jdbc:postgresql://localhost:5432/tom_ci
          SUPABASE_DB_USERNAME: ci_user
          SUPABASE_DB_PASSWORD: ci_password
          JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Publish Maven test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports
          path: |
            target/surefire-reports/**/*.xml
            target/failsafe-reports/**/*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Build production Docker image
        run: docker build --tag smylio-ci:${{ github.sha }} .
