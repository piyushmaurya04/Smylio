# ===== Supabase PostgreSQL Connection =====
spring.config.import=optional:file:.env[.properties]
spring.application.name=TOM
server.port=${PORT:8080}
server.forward-headers-strategy=native
spring.datasource.url=${SUPABASE_JDBC_URL:}
spring.datasource.username=${SUPABASE_DB_USERNAME:}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Expose a public, sanitized health endpoint for Render.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Keep the signing key out of source control; set JWT_SECRET to Base64 for at least 32 random bytes.
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
app.security.refresh.expiration-days=${REFRESH_TOKEN_DAYS:14}
app.security.refresh.cookie-secure=${COOKIE_SECURE:auto}
app.cors.enabled=${CORS_ENABLED:false}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Structured console logging with correlationId from MDC
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level correlationId=%X{correlationId:-none} logger=%logger{36} msg="%msg"%n
